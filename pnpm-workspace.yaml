packages:
  - packages/*
  - examples/*
  # Not an example and deliberately not under `examples/`: it is a Worker built to be OBSERVED,
  # which is evidence, so it lives beside the fixtures that are evidence without HTTP.
  - conformance/reference-worker

# Refuse any package version published less than seven days ago (10080 minutes).
#
# What this defends against is not the key name: it is the compromised release. The usual shape of
# a supply-chain attack on npm is a maintainer account taken over and a malicious version published
# under a name thousands of projects already trust — and the window that matters is short, because
# those releases are almost always spotted, reported and pulled within a few days. Waiting is the
# whole defence. It costs this repository close to nothing: this repository has a handful of dependencies
# that move a few times a year, and none of them is ever needed within a week of its release.
#
# When an install fails on this gate, that is the policy working, and there are two honest answers.
# Widen nothing and wait, which is right whenever the new version is merely convenient. Or add the
# exact version below, which is right when it is genuinely needed sooner — a security fix in the
# dependency itself being the clearest case. Adding an entry is a claim that someone looked; the
# list is kept short so that claim stays readable.
# Which dependencies may run an install script, and why each one may.
#
# pnpm refuses them all by default, which is the right default: a postinstall script runs with the
# privileges of whoever typed `pnpm install`, and it is the shortest path a compromised package has
# to a developer's machine. The gate below buys time for a bad release to be found; this is the
# separate question of which packages get to execute at all, and the answer is almost always none.
#
# Both of these are here for one reason and it is not convenience: each ships a platform binary its
# script downloads and places, and neither works installed and unbuilt — there is no JavaScript
# fallback to fall back to. `workerd` is Cloudflare's runtime, which is what makes
# `examples/fleet-worker` a test ON the platform rather than a test of something shaped like it.
# `esbuild` is what `@cloudflare/vitest-pool-workers` bundles with to get there.
#
# Adding a third is a claim that somebody read what its script does. Keep this list short for the
# same reason the exclusions below are kept short.
allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAge: 10080

