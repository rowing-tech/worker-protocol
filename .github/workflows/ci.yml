name: ci

on:
  pull_request:
  push:
    branches: [main]

# This workflow only reads the tree.
permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm, always. The version comes from the root `packageManager` field, so this
      # workflow and a developer's machine cannot drift apart.
      - uses: pnpm/action-setup@v4

      # Node 26 is a deliberate choice, not an incidental one. Generation runs
      # packages/schemas/src/generate.ts DIRECTLY, through Node's native TypeScript type
      # stripping, so NODE >= 23.6 IS A HARD FLOOR. Downgrading this runner breaks
      # generation with a syntax error in a .ts file, which does not obviously read as
      # "the Node version is too old". Raise it freely; lower it only by first adding a
      # compile step to the two scripts below.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Formatting and lint, from biome.jsonc. It runs FIRST because it is the cheapest
      # step here and the only one whose failure a developer fixes with one command —
      # `pnpm check:fix`. Note what it deliberately does not touch: schemas/, whose bytes
      # belong to the generator checked below, and every .md file, which is the artifact
      # this repository publishes rather than code it formats.
      - name: formatting and lint
        run: pnpm check

      # The reason schemas/ is generated AND committed. This regenerates from the Zod
      # source in memory and compares byte for byte against what is in the tree, naming
      # the files that differ. A generated artifact nobody compares is a claim nobody
      # verifies.
      - name: schemas/ matches packages/schemas
        run: pnpm schemas:check

      # spec/README.md states a rule-id convention — bold carries an id, an id is never reused,
      # a withdrawn id is written only in its file's Withdrawn list. This is what stands behind
      # that claim. A failure names the file, the id and the rule, because a lint that said
      # "spec is invalid" would be the same mistake the ids exist to fix.
      - name: spec/ holds the rule-id convention
        run: pnpm spec:lint

      # spec/README.md says a rule earns its place only if you can name what a conformance
      # check would observe when it is broken. conformance/verifiability.md is where that
      # answer is written down, one row per rule, and this is what keeps the two in step: a
      # rule added without a row fails here, at the moment somebody is still holding the
      # reasoning that would produce one. It also compares the inventory's own counts
      # against the rows beneath them, for the same reason schemas/ is regenerated above.
      - name: every rule is classified by what a check would observe
        run: pnpm verifiability:lint

      # The verifier needs the rule universe at runtime and is published to npm, where spec/
      # does not travel with it — so packages/conformance/rules.json is generated AND
      # committed, exactly like schemas/, and for the same reason. This regenerates it from
      # spec/ and conformance/verifiability.md in memory and compares.
      - name: packages/conformance/rules.json matches spec/
        run: pnpm rules:check

      # Covers scripts/ only. Each workspace project carries its own tsconfig and is checked
      # by the step below.
      - name: type-check repository tooling
        run: pnpm typecheck

      # EVERY file under each project's src/, generators and tests included. The builds below
      # compile only what a package publishes, so without this step a generator — the one kind
      # of code here that can corrupt a normative artifact — would never be checked. It is
      # `-r` rather than a step per project on purpose: a project added without a check is the
      # gap this repository keeps finding, and `-r` cannot have one.
      - name: type-check every workspace project
        run: pnpm -r typecheck

      # Proves the published entry points compile and that the declarations each package ships
      # are the ones its source describes. pnpm orders these by dependency, so schemas builds
      # before conformance, which needs its types.
      - name: build what the packages publish
        run: pnpm -r build

      # Two suites. packages/schemas runs conformance/fixtures/ against the Zod objects —
      # documents against schemas, the half of conformance that needs no Worker, and a verdict
      # about the normative artifact because schemas:check above already proved the two agree.
      # packages/conformance starts examples/reference-worker over a real socket and verifies
      # it, which is the half that does.
      - name: conformance
        run: pnpm test
